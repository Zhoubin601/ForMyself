apply plugin: 'com.android.application'

def kanataM2Synthetic = providers.gradleProperty('kanataM2Synthetic').map { it == 'true' }.orElse(false)
def kanataCatalog = layout.buildDirectory.dir('generated/kanataSqlite/assets')
def kanataRepository = rootProject.projectDir.parentFile
def generateKanataSqliteCatalog = tasks.register('generateKanataSqliteCatalog', Exec) {
    workingDir kanataRepository
    inputs.file new File(kanataRepository, 'scripts/build-kanata-sqlite-catalog.mjs')
    inputs.dir new File(kanataRepository, 'src/features/chat/storage/sqlite')
    inputs.property 'syntheticOnly', kanataM2Synthetic
    outputs.dir kanataCatalog
    commandLine 'node', 'scripts/build-kanata-sqlite-catalog.mjs', kanataCatalog.get().asFile.absolutePath
    if (kanataM2Synthetic.get()) {
        inputs.dir new File(kanataRepository, 'tests/helpers')
        inputs.file new File(kanataRepository, 'docs/qa/kanata-sqlite-m4/fixture.mjs')
        inputs.file new File(kanataRepository, 'docs/qa/kanata-sqlite-m4/completion/fixture.mjs')
        inputs.file new File(kanataRepository, 'docs/qa/kanata-sqlite-m4/m4-r/event-compat/final-closeout/schema005-device.mjs')
        inputs.file new File(kanataRepository, 'docs/qa/kanata-sqlite-m4/m4-r/event-compat/final-closeout/event-semantics-device.mjs')
        inputs.file new File(kanataRepository, 'docs/qa/kanata-sqlite-m4/m4-r/event-compat/final-closeout/message-bounded-device.mjs')
        inputs.file new File(kanataRepository, 'docs/qa/kanata-sqlite-m4/m4-r/event-compat/final-closeout/task-read-device.mjs')
        inputs.dir new File(kanataRepository, 'src/features/chat/presets')
        args '--synthetic'
    }
}

android {
    namespace = "com.yubin.formyself"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.yubin.formyself"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField 'boolean', 'KANATA_M2_SYNTHETIC', 'false'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    adbOptions { timeOutInMs = 120000 }

    buildFeatures { buildConfig true }
    sourceSets {
        if (kanataM2Synthetic.get()) {
            debug.assets.srcDir new File(kanataRepository, 'docs/qa/kanata-sqlite-m2/candidate-assets')
        }
        main.assets.srcDir kanataCatalog
        androidTest.assets.srcDirs += ["../../tests/fixtures"]
    }

    buildTypes {
        debug {
            if (kanataM2Synthetic.get()) {
                applicationIdSuffix '.m2qa'
                buildConfigField 'boolean', 'KANATA_M2_SYNTHETIC', 'true'
            }
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

tasks.named('preBuild').configure { dependsOn(generateKanataSqliteCatalog) }

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "net.zetetic:sqlcipher-android:4.17.0@aar"
    implementation "androidx.sqlite:sqlite:2.4.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
