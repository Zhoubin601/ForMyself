name: Quality

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Enable KVM for isolated device tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run build
      - run: node node_modules/playwright-core/cli.js install android
      - run: npx cap sync android
      - run: bash ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx1024m -Pkotlin.compiler.execution.strategy=in-process :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
        working-directory: android
      - name: Run Android instrumentation and WebView Playwright
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          emulator-build: 11237101
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048 -cores 2 -accel on -skin 480x800
          script: bash docs/qa/architecture-20261026/native/run-ci.sh
      - name: Preserve accepted P6 evidence on the validation branch
        if: success() && github.ref == 'refs/heads/qa/architecture-p6'
        run: |
          python3 - <<'PY'
          import hashlib, json, shutil, zipfile
          from pathlib import Path
          apk = Path('android/app/build/outputs/apk/debug/app-debug.apk')
          evidence = Path('docs/qa/architecture-20261026/native')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert json.loads((evidence/'playwright-results.json').read_text())['apkSha256'] == digest
          files = [p for p in Path('dist').rglob('*') if p.is_file()]
          with zipfile.ZipFile(apk) as archive:
              mismatches = [str(p) for p in files if archive.read('assets/public/'+p.relative_to('dist').as_posix()) != p.read_bytes()]
          assert not mismatches, mismatches
          (evidence/'apk-assets-ci.json').write_text(json.dumps({'apk_sha256':digest,'production_asset_count':len(files),'mismatches':mismatches},indent=2)+'\n')
          output = Path('output/20261026-ForMyself-architecture-p6-debug-v1.apk')
          output.parent.mkdir(exist_ok=True)
          shutil.copyfile(apk, output)
          print('Accepted APK SHA256:', digest)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qa/architecture-20261026/native/playwright-results.json docs/qa/architecture-20261026/native/playwright-cleanup.json docs/qa/architecture-20261026/native/apk-assets-ci.json docs/qa/architecture-20261026/native/native-home.png docs/qa/architecture-20261026/native/native-chat.png docs/qa/architecture-20261026/native/native-vault.png output/20261026-ForMyself-architecture-p6-debug-v1.apk
          git commit -m 'test: preserve accepted P6 Android evidence [skip ci]'
          git push origin HEAD:qa/architecture-p6
      - name: Preserve failed device diagnostics on the validation branch
        if: failure() && github.ref == 'refs/heads/qa/architecture-p6'
        env:
          P6_RUN_ID: ${{ github.run_id }}
        run: |
          if [ ! -f docs/qa/architecture-20261026/native/playwright-attempt.json ]; then exit 0; fi
          python3 - <<'PYCODE'
          import os, shutil
          from pathlib import Path
          source = Path('docs/qa/architecture-20261026/native')
          destination = source/'ci-failures'/os.environ['P6_RUN_ID']
          destination.mkdir(parents=True, exist_ok=True)
          for name in ['playwright-attempt.json','playwright-failure.png','app-event-diagnostics.txt','playwright-crash-summary.txt','android-display-failure.png']:
              if (source/name).exists(): shutil.copyfile(source/name, destination/name)
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/qa/architecture-20261026/native/ci-failures
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'test: preserve failed P6 device diagnostics [skip ci]'
          git push origin HEAD:qa/architecture-p6
      - name: Preserve Android verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests/
            android/app/build/outputs/androidTest-results/
            docs/qa/architecture-20261026/native/
            android/app/build/outputs/apk/debug/app-debug.apk
